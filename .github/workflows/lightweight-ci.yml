name: Lightweight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked source dependencies without desktop setup
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply repository dependency patches
        run: bun run apply:patches
      - name: Typecheck renderer and shared sources
        run: bun run build:tsc
      - name: Typecheck desktop sources without native rebuilds
        run: bun x --no-install tsc --project electron-tsconfig.json --noEmit
      - name: Test renderer and shared behavior
        run: bun x --no-install vitest run src/renderer src/shared --maxWorkers=2
      - name: Test native durable execution and work documents
        run: bun x --no-install vitest run src/main/libs/agentEngine/durable src/main/libs/agentEngine/piRuntimeAdapter.test.ts src/main/contentWorker src/main/toolApproval --maxWorkers=2
      - name: Build SQLite binding for history archive tests
        run: npm rebuild better-sqlite3
      - name: Test history indexing, managed attachments and maintenance recovery
        run: bun x --no-install vitest run src/main/history --maxWorkers=2
      - name: Test local CLI manager lifecycle and packaging contracts
        run: bun x --no-install vitest run src/main/magpie src/main/appPreferences.test.ts src/main/ipcHandlers/ollama.test.ts src/main/enterpriseExtension/managedProviderBridge.test.ts scripts/magpie-runtime.test.ts tests/electron-builder-hooks.test.ts --maxWorkers=2
      - name: Build renderer without Electron packaging
        run: bun run build:vite
        env:
          VITE_SKIP_ELECTRON: '1'
