name: Lightweight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked source dependencies without desktop setup
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify production dependency manifest
        run: node scripts/ci/check-electron-runtime-dependencies.mjs --manifest-only
      - name: Apply repository dependency patches
        run: bun run apply:patches
      - name: Typecheck renderer and shared sources
        run: bun run build:tsc
      - name: Typecheck desktop sources without native rebuilds
        run: bun x --no-install tsc --project electron-tsconfig.json --noEmit
      - name: Test renderer and shared behavior
        run: bun x --no-install vitest run src/renderer src/shared --maxWorkers=2
      - name: Test native durable execution and work documents
        run: bun x --no-install vitest run src/main/libs/agentEngine/durable src/main/libs/agentEngine/piRuntimeAdapter.test.ts src/main/libs/agentEngine/legacyEngineCleanup.test.ts src/main/contentWorker src/main/toolApproval --maxWorkers=2
      - name: Build native bindings for history and Coding tests
        run: npm rebuild better-sqlite3 node-pty
      - name: Test native content replay and retained Coding contracts
        run: bun x --no-install vitest run src/main/coworkContentBridge.test.ts src/main/coworkContentProjection.test.ts src/main/codingAgent/codingBuiltinCapabilities.test.ts src/main/codingAgent/codingRoomService.test.ts src/main/codingAgent/drivers/acpCodingDriver.test.ts src/main/codingAgent/drivers/builtinCodingDriver.test.ts --maxWorkers=2
      - name: Test history indexing, managed attachments and maintenance recovery
        run: bun x --no-install vitest run src/main/history --maxWorkers=2
      - name: Test local CLI manager lifecycle and packaging contracts
        run: bun x --no-install vitest run src/main/magpie src/main/appPreferences.test.ts src/main/ipcHandlers/ollama.test.ts src/main/enterpriseExtension/managedProviderBridge.test.ts scripts/magpie-runtime.test.ts tests/electron-builder-hooks.test.ts tests/nativePhotonPackaging.test.ts tests/retiredPackagingResources.test.ts scripts/ci/check-electron-runtime-dependencies.test.ts --maxWorkers=2
      - name: Build source outputs and verify desktop runtime dependencies
        run: bun run build
      - name: Verify renderer bundle budget
        run: bun run test:bundle-budget
      - name: Resolve packaged runtime with production-only dependencies
        run: |
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          cp package.json bun.lock "$probe/"
          (cd "$probe" && bun install --frozen-lockfile --production --ignore-scripts)
          cp -R dist-electron "$probe/"
          RUNTIME_PROBE_ROOT="$probe" node --input-type=module -e "import { checkElectronRuntimeDependencies } from './scripts/ci/check-electron-runtime-dependencies.mjs'; checkElectronRuntimeDependencies(process.env.RUNTIME_PROBE_ROOT, { resolve: true });"
