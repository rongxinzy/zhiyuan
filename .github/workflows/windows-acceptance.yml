name: Windows x64 unsigned acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'electron-builder.windows-acceptance.cjs'
      - 'scripts/ci/windows-acceptance*'
      - 'scripts/ci/windows-app-smoke*'
      - 'scripts/build-magpie-runtime.cjs'
      - 'scripts/native-package-hygiene*'
      - 'electron-builder.json'
      - 'scripts/electron-builder-hooks.cjs'
      - 'scripts/installer-ui/**'
      - 'scripts/installer/**'
      - 'scripts/nsis-installer.nsh'
      - 'tests/nsis-installer.test.ts'
      - 'src/main/libs/agentEngine/durable/nativeExecution*'
      - 'scripts/ci/windows-installer-*'
      - 'scripts/ci/windows-shell-*'
      - 'scripts/installer-shell/**'

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install locked dependencies without application setup
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Verify acceptance safeguards
        run: bun x --no-install vitest run scripts/ci/windows-app-smoke.test.ts scripts/ci/windows-acceptance-install.test.ts scripts/ci/windows-acceptance-resources.test.ts scripts/ci/windows-installer-interactive.test.ts scripts/ci/windows-shell-interactive.test.ts scripts/installer-shell/sfx-format.test.ts scripts/installer-shell/preview-ui.test.ts scripts/installer-shell/app/engine-contracts.test.ts scripts/ci/windows-installer-size-smoke.test.ts tests/nsis-installer.test.ts scripts/magpie-archive.test.ts scripts/native-package-hygiene.test.ts scripts/installer/validate-offline-components.test.ts scripts/installer/cleanup-after-install.test.ts scripts/installer/recover-component-switch.test.ts scripts/ci/windows-installer-diagnostics.test.ts scripts/setup-mingit.test.ts src/renderer/components/cowork/CoworkView.modelGate.test.tsx --maxWorkers=1
      - name: Record isolated Windows PowerShell startup evidence
        run: node scripts/ci/windows-powershell-startup.mjs --output acceptance-diagnostics/powershell-startup
      - name: Download official Electron for packaging
        run: node node_modules/electron/install.js
      - name: Clean cross-platform source build and runtime gate
        run: bun run build
      - name: Resolve generated runtime against isolated production dependencies
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'zhiyuan-production-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Copy-Item package.json,bun.lock $probe
          Push-Location $probe
          try {
            bun install --frozen-lockfile --production --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Production-only dependency installation failed' }
          } finally { Pop-Location }
          Copy-Item -Recurse dist-electron $probe
          $env:RUNTIME_PROBE_ROOT = $probe
          node --input-type=module -e "import { checkElectronRuntimeDependencies } from './scripts/ci/check-electron-runtime-dependencies.mjs'; checkElectronRuntimeDependencies(process.env.RUNTIME_PROBE_ROOT, { resolve: true });"
          if ($LASTEXITCODE -ne 0) { throw 'Production-only runtime resolution failed' }
      - name: Prepare pinned official Windows resources
        shell: pwsh
        run: ./scripts/ci/windows-acceptance-resources.ps1
      - name: Exercise native PowerShell before installer assembly
        run: node scripts/ci/windows-app-smoke.mjs --native-shell-only --app node_modules/electron/dist/electron.exe --runner dist-electron/native-execution-smoke.js --resources resources --output acceptance-diagnostics/native-shell-preflight
      - name: Build Electron ABI native modules
        run: bun run rebuild:electron-native
      - name: Verify resources before packaging
        run: node scripts/ci/windows-acceptance-resources.cjs verify-inputs
      - name: Build unsigned NSIS acceptance installer
        run: bun x --no-install electron-builder --win nsis --x64 --config electron-builder.windows-acceptance.cjs --publish never
      - name: Enforce Windows installer size budgets
        shell: pwsh
        run: ./scripts/ci/windows-installer-size-smoke.ps1
      - name: Verify packaged resources and record hashes
        run: node scripts/ci/windows-acceptance-resources.cjs verify-package release/win-unpacked
      - name: Execute packaged native SQLite and WASM probes
        run: node scripts/ci/windows-acceptance-resources.cjs probe-runtime release/win-unpacked
      - name: Exercise actual NSIS install, finish, launch, cancel and recovery
        # Windows PowerShell provides the OS-native System.Drawing assembly.
        # Unavailable interactive desktop/screenshots fail the gate, never skip it.
        shell: powershell
        run: ./scripts/ci/windows-installer-interactive.ps1
      - name: Preserve underlying NSIS silent-install regression
        shell: pwsh
        run: ./scripts/ci/windows-acceptance-install.ps1 -NativeOnly
      - name: Build official .NET 8 single-file WebView2 shell
        shell: pwsh
        run: |
          $env:ZHIYUAN_DOTNET = (Get-Command dotnet).Source
          node scripts/installer-shell/build-shell.cjs
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 shell build failed' }
      - name: Pack final shell with real application and offline components
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release/setup | Out-Null
          node scripts/installer-shell/pack-setup.cjs --app-dir release/win-unpacked --components-dir build-tar/windows-components --out "release/setup/ZhiYuanAgent-Setup-$version-win-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Final single-file shell assembly failed' }
      - name: Exercise actual WebView2 shell install, done, launch and recovery
        run: node scripts/ci/windows-shell-interactive.mjs
      - name: Validate shell-installed application and release only the final shell
        shell: pwsh
        run: ./scripts/ci/windows-acceptance-install.ps1
      - name: Upload verified unsigned installer and acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: zhiyuan-windows-x64-unsigned-${{ github.sha }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload diagnostics when acceptance fails
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-diagnostics-${{ github.run_id }}
          path: |
            acceptance-diagnostics/
            release/builder-debug.yml
          if-no-files-found: warn
          retention-days: 14
